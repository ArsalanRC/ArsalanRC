name: Chess

# Anyone on the internet can open an issue here, so this workflow treats every
# title as a request from an untrusted stranger. Two consequences shape it:
#
#   1. Permissions are the minimum needed: write to this repo's contents and
#      issues, nothing else. No secrets are exposed to the job.
#   2. The issue title is never executed, interpolated into a shell, or trusted
#      as a move. It is passed as a single argv entry to a Node script, which
#      only plays it if the engine independently agrees it is legal.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Two people moving at once would otherwise race on state.json and the README.
# Queue rather than cancel: every submitted move deserves a reply.
concurrency:
  group: chess
  cancel-in-progress: false

jobs:
  play:
    # Cheap pre-filter so unrelated issues never start a runner.
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Play the move
        id: play
        env:
          # Through the environment, never interpolated into the run block.
          # `${{ }}` inside a shell command would let an issue title titled
          # `"; rm -rf /` execute; an env var is inert data.
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: |
          node game/play.mjs "$TITLE" "$ACTOR"
          {
            echo 'reply<<GHEOF'
            cat game/last-reply.txt
            echo GHEOF
          } >> "$GITHUB_OUTPUT"

      - name: Commit the new position
        run: |
          git config user.name  "ArsalanRC"
          git config user.email "136238170+ArsalanRC@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --staged --quiet; then
            echo "Nothing changed, so nothing to commit."
          else
            git commit -m "chess: ${TITLE#chess|} by @${ACTOR}"
            # Another game may have landed while this one was thinking.
            git pull --rebase --autostash origin main
            git push
          fi
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          REPLY: ${{ steps.play.outputs.reply }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s\n\n[Back to the board](https://github.com/%s#play-me-at-chess-from-inside-this-readme)\n' \
            "$REPLY" "$GITHUB_REPOSITORY" > /tmp/comment.md
          gh issue comment "$NUMBER" --body-file /tmp/comment.md
          gh issue close "$NUMBER"
