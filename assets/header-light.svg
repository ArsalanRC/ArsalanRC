<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340"
  role="img" aria-label="Arsalan Khadim, software architect and full-stack engineer">
  <title>Arsalan Khadim, software architect and full-stack engineer</title>

  <defs>
    <linearGradient id="ramp" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="0" y2="3058">
      <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
      <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
    </linearGradient>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse"
                    cx="1049.6" cy="-122.32000000000001" r="1681.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <!-- Top corners only. Rounding the bottom too would cut the sky away where
         the next panel butts up square, and the page background would show
         through as two notches. -->
    <clipPath id="frame"><path d="M0 14 A14 14 0 0 1 14 0 H1266 A14 14 0 0 1 1280 14 V340 H0 Z"/></clipPath>
    <style>
      /* The caret. The only motion, and it earns it because the name is set
         in mono and reads as something being typed. Everything else is still
         on purpose: drifting particles read as filler however well made. */
      .caret { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#ramp)"/>
    <rect width="1280" height="340" fill="url(#sun)"/>

    <!-- The same page-space clouds every other panel draws. Positioned by page
         fraction, not panel fraction, so a cloud that straddles the bottom edge
         continues into the panel below instead of stopping at the seam. -->
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft)">
      <ellipse cx="179.20000000000002" cy="168.19" rx="150" ry="26"/><ellipse cx="256" cy="146.784" rx="90" ry="21"/><ellipse cx="1062.3999999999999" cy="79.508" rx="130" ry="24"/><ellipse cx="998.4000000000001" cy="67.276" rx="80" ry="18"/>
    </g>


    <!-- A glass pane holding the name block, so the header uses the same
         surface language as every card below it. -->
    <rect x="56" y="72" width="700" height="196" rx="16"
          fill="#FFFFFF" fill-opacity="0.6"
          stroke="#15202B" stroke-opacity="0.16"/>
    <path d="M72 72.75 H740" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.5"/>

    <rect x="88" y="104" width="46" height="4" rx="2" fill="#E8552B"/>

    <text x="88" y="168" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="58" font-weight="800"
          letter-spacing="-2" fill="#15202B">Arsalan Khadim</text>
    <rect class="caret" x="528" y="128" width="13" height="46" fill="#E8552B"/>

    <text x="90" y="204" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="14" letter-spacing="3.4"
          fill="#31465A">SOFTWARE ARCHITECT &#183; FULL-STACK ENGINEER</text>
    <text x="90" y="234" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="12.5" letter-spacing="1.6"
          fill="#5B7186">Interface to integration &#183; TypeScript &#183; Python &#183; Java</text>

    <!-- The wire and nodes, kept from the first header: a small system diagram,
         which is the subject of the whole profile. -->
    <g stroke="#15202B" stroke-opacity="0.28" fill="none" stroke-width="1.5">
      <path d="M812 250 L960 250 L1040 150 L1170 118"/>
      <path d="M1040 150 L1128 236"/>
    </g>
    <g>
      <circle cx="1040" cy="150" r="15" fill="#FFFFFF" fill-opacity="0.6"
              stroke="#15202B" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="1040" cy="150" r="6" fill="#E8552B"/>
      <circle cx="1170" cy="118" r="15" fill="#FFFFFF" fill-opacity="0.6"
              stroke="#15202B" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="1128" cy="236" r="15" fill="#FFFFFF" fill-opacity="0.6"
              stroke="#15202B" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="1128" cy="236" r="6" fill="#2B8FEA"/>
    </g>
    <rect x="812" y="246" width="34" height="7" rx="3.5" fill="#E8552B"/>
  </g>
</svg>
