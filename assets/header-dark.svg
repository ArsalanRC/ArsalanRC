<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340"
  role="img" aria-label="Arsalan Khadim, software architect and full-stack engineer">
  <title>Arsalan Khadim, software architect and full-stack engineer</title>

  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
      <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="-0.18" r="1.1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="340" rx="14"/></clipPath>
    <style>
      /* The caret. The only motion, and it earns it because the name is set
         in mono and reads as something being typed. Everything else is still
         on purpose: drifting particles read as filler however well made. */
      .caret { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#ramp)"/>
    <rect width="1280" height="340" fill="url(#sun)"/>

    <!-- Clouds, the same two-depth idea as the site, blurred ellipses. -->
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft)">
      <ellipse cx="180" cy="248" rx="150" ry="26"/>
      <ellipse cx="250" cy="232" rx="90"  ry="22"/>
      <ellipse cx="1080" cy="92" rx="130" ry="24"/>
      <ellipse cx="1010" cy="80" rx="80"  ry="19"/>
    </g>

    <!-- A glass pane holding the name block, so the header uses the same
         surface language as every card below it. -->
    <rect x="56" y="72" width="700" height="196" rx="16"
          fill="#FFFFFF" fill-opacity="0.07"
          stroke="#EAF1F7" stroke-opacity="0.14"/>
    <path d="M72 72.75 H740" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>

    <rect x="88" y="104" width="46" height="4" rx="2" fill="#FF6A3D"/>

    <text x="88" y="168" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="58" font-weight="800"
          letter-spacing="-2" fill="#EAF1F7">Arsalan Khadim</text>
    <rect class="caret" x="528" y="128" width="13" height="46" fill="#FF6A3D"/>

    <text x="90" y="204" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="14" letter-spacing="3.4"
          fill="#9FB6C6">SOFTWARE ARCHITECT &#183; FULL-STACK ENGINEER</text>
    <text x="90" y="234" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="12.5" letter-spacing="1.6"
          fill="#6C879A">Interface to integration &#183; TypeScript &#183; Python &#183; Java</text>

    <!-- The wire and nodes, kept from the first header: a small system diagram,
         which is the subject of the whole profile. -->
    <g stroke="#EAF1F7" stroke-opacity="0.28" fill="none" stroke-width="1.5">
      <path d="M812 250 L960 250 L1040 150 L1170 118"/>
      <path d="M1040 150 L1128 236"/>
    </g>
    <g>
      <circle cx="1040" cy="150" r="15" fill="#FFFFFF" fill-opacity="0.07"
              stroke="#EAF1F7" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="1040" cy="150" r="6" fill="#FF6A3D"/>
      <circle cx="1170" cy="118" r="15" fill="#FFFFFF" fill-opacity="0.07"
              stroke="#EAF1F7" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="1128" cy="236" r="15" fill="#FFFFFF" fill-opacity="0.07"
              stroke="#EAF1F7" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="1128" cy="236" r="6" fill="#4FA6F0"/>
    </g>
    <rect x="812" y="246" width="34" height="7" rx="3.5" fill="#FF6A3D"/>
  </g>
</svg>
