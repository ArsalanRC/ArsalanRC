<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190"
    role="img" aria-label="stylo: Neunzehn Messungen an einem Text, jede gegen echte menschliche Prosa.">
    <title>stylo</title>
    
    <defs>
      <linearGradient id="ramp-s18" gradientUnits="userSpaceOnUse"
