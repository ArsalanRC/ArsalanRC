    </defs>
    <rect width="1000" height="190" fill="url(#ramp-s67)"/><rect width="1000" height="190" fill="url(#sun-s67)"/>
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft-s67)" clip-path="url(#clip-s67)"><ellipse cx="880" cy="-70.84024999999997" rx="140" ry="18"/></g>
    <defs><filter id="lift-l59" x="-25%" y="-25%" width="150%" height="170%">
