<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 286" width="1000" height="286"
    role="img" aria-label="">
    <title></title>
    
    <defs>
      <linearGradient id="ramp-s105" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-340" x2="0" y2="2718">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s105" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s105"><rect width="1000" height="286"/></clipPath>
      <radialGradient id="sun-s105" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-462.32" r="1681.9">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
