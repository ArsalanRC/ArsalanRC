<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 311" width="1000" height="311"
    role="img" aria-label="">
    <title></title>
    
    <defs>
      <linearGradient id="ramp-s80" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-265.625" x2="0" y2="3206">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s80" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s80"><rect width="1000" height="311"/></clipPath>
      <radialGradient id="sun-s80" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-404.49" r="1909.3937500000002">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="311" fill="url(#ramp-s80)"/><rect width="1000" height="311" fill="url(#sun-s80)"/>
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft-s80)" clip-path="url(#clip-s80)"><ellipse cx="140" cy="53.7645" rx="150" ry="26"/><ellipse cx="200" cy="48.55706249999997" rx="90" ry="21"/><ellipse cx="620" cy="220.40250000000003" rx="130" ry="22"/></g><text x="44" y="26" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Software architect and full-stack engineer.</tspan> Currently Software Development Manager, which means I own the systems and</text><text x="44" y="51" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">the roadmap as well as a fair share of the commits.</text><text x="44" y="108" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Most of my working life goes on the unglamorous half of software. Making systems exchange data reliably when they were</text><text x="44" y="133" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">never built to talk at all. Warehouse management, ERP integrations, logistics APIs. The kind of code where nothing</text><text x="44" y="158" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">looks broken and somebody's delivery quietly never arrives.</text><text x="44" y="215" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">The repos here are the other half. Same problems, built from scratch, with the time to get the structure right before</text><text x="44" y="240" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">anything sits on top of it.</text>
  </svg>
