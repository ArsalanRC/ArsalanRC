<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488"
    role="img" aria-label="Wie ich an Bauen herangehe">
    <title>Wie ich an Bauen herangehe</title>
    
    <defs>
      <linearGradient id="ramp-s53" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-2430.625" x2="0" y2="1335">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s53" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s53"><rect width="1000" height="488"/></clipPath>
      <radialGradient id="sun-s53" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-2581.25" r="2071.09375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="488" fill="url(#ramp-s53)"/><rect width="1000" height="488" fill="url(#sun-s53)"/>
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft-s53)" clip-path="url(#clip-s53)"><ellipse cx="120" cy="85.94218749999982" rx="120" ry="20"/></g><text x="44" y="58" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5"
      font-weight="700" letter-spacing="2.4" fill="#FFFFFF">HALTUNG</text><text x="44" y="104" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="34"
      font-weight="800" letter-spacing="-1" fill="#EAF1F7">Wie ich an Bauen herangehe</text><text x="44" y="146" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Zuerst die Grenzen ziehen.</tspan> Wo die Schichten getrennt werden, ist die eine Entscheidung, die teuer wird, sobald Code</text><text x="44" y="171" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">darauf sitzt. Alles andere lässt sich an einem Nachmittag neu schreiben, deshalb bekommt dieser Teil die Zeit.</text><text x="44" y="228" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Den Kern frei vom Framework halten.</tspan> Fachlogik, die nichts importiert, lässt sich ohne Browser, Server und Datenbank</text><text x="44" y="253" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">testen. Seiteneffekte an den Rand schieben, dann bleibt die Mitte einfach genug, um sie zu durchdenken.</text><text x="44" y="310" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Sicher, bevor Daten da sind.</tspan> Row Level Security ist aktiv, bevor die Tabelle eine einzige Zeile hat, und jede Policy</text><text x="44" y="335" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">verbietet standardmäßig. Eine Berechtigung, die nie vergeben wurde, kann nicht die undichte Stelle sein.</text><text x="44" y="392" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Aufschreiben.</tspan> Jedes Projekt von mir hat Architektur und Konventionen dokumentiert, damit jemand Neues, oder ein</text><text x="44" y="417" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">Sprachmodell, ohne Vorwissen einsteigen und binnen einer Stunde sinnvoll arbeiten kann.</text>
  </svg>
