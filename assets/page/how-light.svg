<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488"
    role="img" aria-label="How I think about building">
    <title>How I think about building</title>
    
    <defs>
      <linearGradient id="ramp-s98" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-1949.625" x2="0" y2="1310">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s98" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s98"><rect width="1000" height="488"/></clipPath>
      <radialGradient id="sun-s98" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-2080.01" r="1792.79375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="488" fill="url(#ramp-s98)"/><rect width="1000" height="488" fill="url(#sun-s98)"/>
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft-s98)" clip-path="url(#clip-s98)"><ellipse cx="120" cy="150.87734999999975" rx="120" ry="20"/></g><text x="44" y="58" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5"
      font-weight="700" letter-spacing="2.4" fill="#FFFFFF" style="paint-order:stroke" stroke="#2E6EA6" stroke-opacity="0.55" stroke-width="2.5">APPROACH</text><text x="44" y="104" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="34"
      font-weight="800" letter-spacing="-1" fill="#15202B">How I think about building</text><text x="44" y="146" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Boundaries before features.</tspan> The layer split is the one decision you cannot cheaply undo later, so it deserves the</text><text x="44" y="171" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">time. Everything else is negotiable.</text><text x="44" y="228" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Purity where it counts.</tspan> Business logic that depends on no framework can actually be tested, reused and reasoned about.</text><text x="44" y="253" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Push side effects out to the edges and keep the middle honest.</text><text x="44" y="310" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Secure by default, not by review.</tspan> RLS enabled before the table has rows, and deny-by-default policies throughout. A</text><text x="44" y="335" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">permission you never granted cannot be the one that leaks.</text><text x="44" y="392" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Write it down.</tspan> Every project I own carries architecture docs and conventions that a new engineer, or an LLM, can read</text><text x="44" y="417" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">cold and be useful within the hour.</text>
  </svg>
