<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190"
    role="img" aria-label="Arena Lounge: Mein Buildathon-Beitrag 2026, unter Verschluss bis 4. September.">
    <title>Arena Lounge</title>
    
    <defs>
      <linearGradient id="ramp-s144" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-1480.625" x2="0" y2="2285">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s144" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s144"><rect width="500" height="190"/></clipPath>
      <radialGradient id="sun-s144" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1631.25" r="2071.09375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="500" height="190" fill="url(#ramp-s144)"/><rect width="500" height="190" fill="url(#sun-s144)"/>
    
    <defs><filter id="lift-l127" x="-25%" y="-25%" width="150%" height="170%">
         <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#03080F"
                       flood-opacity="0.16"/>
       </filter></defs>
    <rect x="14" y="14" width="472" height="162" rx="12"
          fill="#FFFFFF" fill-opacity="0.68"
          stroke="#E8552B" stroke-opacity="0.42"
          filter="url(#lift-l127)"/>
    <path d="M26 14.75 H474" stroke="#FFFFFF"
          stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="36" y="52" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="22" font-weight="800"
          letter-spacing="-0.6" fill="#15202B">Arena Lounge</text>
    
    <text x="36" y="74" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" font-weight="700"
          letter-spacing="2" fill="#4B6274">DECENTRALAND · TYPESCRIPT</text>
    <text x="36" y="108" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="14"
