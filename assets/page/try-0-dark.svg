<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 104" width="500" height="104"
    role="img" aria-label="Play my chess engine: A minimax bot with alpha-beta pruning, and its position hash beside the board">
    <title>Play my chess engine</title>
    
    <defs>
      <linearGradient id="ramp-s20" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-904.625" x2="0" y2="3449">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s20" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s20"><rect width="500" height="104"/></clipPath>
      <radialGradient id="sun-s20" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1078.77" r="2394.49375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="500" height="104" fill="url(#ramp-s20)"/><rect width="500" height="104" fill="url(#sun-s20)"/>
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft-s20)" clip-path="url(#clip-s20)"><ellipse cx="300" cy="-77.87161249999997" rx="170" ry="22"/></g>
    
    <rect x="14" y="10" width="472" height="84" rx="12"
          fill="#FFFFFF" fill-opacity="0.055"
          stroke="#FFFFFF" stroke-opacity="0.13"
          />
    <path d="M26 10.75 H474" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1.5"/>
    <text x="30" y="36" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#FF6A3D">&#9654;</text>
    <text x="52" y="36" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#EAF1F7">Play my chess engine</text>
    <text x="52" y="58" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
             fill="#6C879A">A minimax bot with alpha-beta pruning, and its position hash</text><text x="52" y="77" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
             fill="#6C879A">beside the board</text>
  </svg>
