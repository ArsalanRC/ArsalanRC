<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84"
    role="img" aria-label="Play my chess engine: A minimax bot with alpha-beta pruning, and the engine's internal state on display beside the board">
    <title>Play my chess engine</title>
    
    <defs>
      <linearGradient id="ramp-s19" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-879.625" x2="0" y2="2380">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s19" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s19"><rect width="1000" height="84"/></clipPath>
      <radialGradient id="sun-s19" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1010.01" r="1792.79375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="84" fill="url(#ramp-s19)"/><rect width="1000" height="84" fill="url(#sun-s19)"/>
    
    
    <rect x="28" y="8" width="944" height="68" rx="12"
          fill="#FFFFFF" fill-opacity="0.055"
          stroke="#FFFFFF" stroke-opacity="0.13"/>
    <path d="M40 8.75 H960" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1.5"/>
    <text x="44" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#FF6A3D">&#9654;</text>
    <text x="66" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#EAF1F7">Play my chess engine</text>
    <text x="66" y="61" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
          fill="#6C879A">A minimax bot with alpha-beta pruning, and the engine's internal state on display beside the board</text>
  </svg>
