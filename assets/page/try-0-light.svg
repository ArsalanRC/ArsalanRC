<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 104" width="500" height="104"
    role="img" aria-label="Play my chess engine: A minimax bot with alpha-beta pruning, and its position hash beside the board">
    <title>Play my chess engine</title>
    
    <defs>
      <linearGradient id="ramp-s101" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-904.625" x2="0" y2="3155">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s101" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s101"><rect width="500" height="104"/></clipPath>
      <radialGradient id="sun-s101" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1067.01" r="2232.7937500000003">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="500" height="104" fill="url(#ramp-s101)"/><rect width="500" height="104" fill="url(#sun-s101)"/>
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft-s101)" clip-path="url(#clip-s101)"><ellipse cx="300" cy="-78.08534999999995" rx="170" ry="22"/></g>
    
    <rect x="14" y="10" width="472" height="84" rx="12"
          fill="#FFFFFF" fill-opacity="0.68"
          stroke="#15202B" stroke-opacity="0.13"
          />
    <path d="M26 10.75 H474" stroke="#FFFFFF"
          stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="30" y="36" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#E8552B">&#9654;</text>
    <text x="52" y="36" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#15202B">Play my chess engine</text>
    <text x="52" y="58" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
             fill="#8FA9BC">A minimax bot with alpha-beta pruning, and its position hash</text><text x="52" y="77" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
             fill="#8FA9BC">beside the board</text>
  </svg>
