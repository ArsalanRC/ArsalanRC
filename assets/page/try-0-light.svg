<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84"
    role="img" aria-label="Play my chess engine: A minimax bot with alpha-beta pruning, and the engine's internal state on display beside the board">
    <title>Play my chess engine</title>
    
    <defs>
      <linearGradient id="ramp-s96" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-904.625" x2="0" y2="2595">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s96" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s96"><rect width="1000" height="84"/></clipPath>
      <radialGradient id="sun-s96" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1044.6100000000001" r="1924.79375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="84" fill="url(#ramp-s96)"/><rect width="1000" height="84" fill="url(#sun-s96)"/>
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft-s96)" clip-path="url(#clip-s96)"><ellipse cx="300" cy="-79.41342499999996" rx="170" ry="22"/></g>
    
    <rect x="28" y="8" width="944" height="68" rx="12"
          fill="#FFFFFF" fill-opacity="0.68"
          stroke="#15202B" stroke-opacity="0.13"/>
    <path d="M40 8.75 H960" stroke="#FFFFFF"
          stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="44" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#E8552B">&#9654;</text>
    <text x="66" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#15202B">Play my chess engine</text>
    <text x="66" y="61" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
          fill="#8FA9BC">A minimax bot with alpha-beta pruning, and the engine's internal state on display beside the board</text>
  </svg>
