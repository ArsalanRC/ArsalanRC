<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488"
    role="img" aria-label="Wie ich an Bauen herangehe">
    <title>Wie ich an Bauen herangehe</title>
    
    <defs>
      <linearGradient id="ramp-s144" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-2024" x2="0" y2="1034">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <radialGradient id="sun-s144" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-2146.32" r="1681.9">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="488" fill="url(#ramp-s144)"/><rect width="1000" height="488" fill="url(#sun-s144)"/><text x="44" y="58" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5"
      font-weight="700" letter-spacing="2.4" fill="#E8552B">HALTUNG</text><text x="44" y="104" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="34"
      font-weight="800" letter-spacing="-1" fill="#15202B">Wie ich an Bauen herangehe</text><text x="44" y="146" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Grenzen vor Features.</tspan> Der Schnitt zwischen den Schichten ist die eine Entscheidung, die sich später nicht billig</text><text x="44" y="171" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">zurücknehmen lässt. Alles andere ist verhandelbar.</text><text x="44" y="228" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Reinheit, wo sie zählt.</tspan> Fachlogik ohne Framework-Abhängigkeit lässt sich wirklich testen, wiederverwenden und</text><text x="44" y="253" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">durchdenken. Seiteneffekte an den Rand schieben und die Mitte ehrlich halten.</text><text x="44" y="310" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Sicher by default, nicht durch Review.</tspan> RLS aktiv, bevor die Tabelle Zeilen hat, und durchgängig Deny-by-default. Eine</text><text x="44" y="335" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Berechtigung, die nie vergeben wurde, kann nicht die undichte Stelle sein.</text><text x="44" y="392" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Aufschreiben.</tspan> Jedes Projekt von mir trägt Architekturdokumentation und Konventionen, die ein neuer Mensch, oder ein</text><text x="44" y="417" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">LLM, kalt lesen und binnen einer Stunde nutzen kann.</text>
  </svg>
