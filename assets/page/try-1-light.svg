<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84"
    role="img" aria-label="See how integration-patterns works: Send the same webhook twice and watch the second one do nothing. Then watch a retry storm finish off a recovering service">
    <title>See how integration-patterns works</title>
    
    <defs>
      <linearGradient id="ramp-s97" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-972.625" x2="0" y2="2527">
        <stop offset="0" stop-color="#4E9BD9"/><stop offset="0.42" stop-color="#6FB2E6"/>
        <stop offset="0.78" stop-color="#97CBEF"/><stop offset="1" stop-color="#B9DEF6"/>
      </linearGradient>
      <filter id="soft-s97" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s97"><rect width="1000" height="84"/></clipPath>
      <radialGradient id="sun-s97" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1112.6100000000001" r="1924.79375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="84" fill="url(#ramp-s97)"/><rect width="1000" height="84" fill="url(#sun-s97)"/>
    
    
    <rect x="28" y="8" width="944" height="68" rx="12"
          fill="#FFFFFF" fill-opacity="0.68"
          stroke="#15202B" stroke-opacity="0.13"/>
    <path d="M40 8.75 H960" stroke="#FFFFFF"
          stroke-opacity="0.85" stroke-width="1.5"/>
    <text x="44" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
