          fill="#4B6274">ERP-Integrationen, Logistik-APIs. Die Sorte Code, bei der ein stiller Fehler jemanden eine Lieferung kostet.</text><text x="44" y="215" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Die Repos hier sind die andere Hälfte, wo ich etwas von Grund auf entwerfen und die Architektur ernst nehmen darf.</text>
