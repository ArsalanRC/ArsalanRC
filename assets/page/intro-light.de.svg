    <rect width="1000" height="311" fill="url(#ramp-s118)"/><rect width="1000" height="311" fill="url(#sun-s118)"/>
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft-s118)" clip-path="url(#clip-s118)"><ellipse cx="140" cy="63.33249999999998" rx="150" ry="26"/><ellipse cx="200" cy="57.96906250000001" rx="90" ry="21"/><ellipse cx="620" cy="234.96250000000003" rx="130" ry="22"/></g><text x="44" y="26" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#4B6274">
          <tspan font-weight="700" fill="#15202B">Softwarearchitekt und Full-Stack-Engineer.</tspan> Aktuell Software Development Manager, das heißt, mir gehören die Systeme</text><text x="44" y="51" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">und die Roadmap, dazu ein ordentlicher Teil der Commits.</text><text x="44" y="108" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Der größte Teil meiner Arbeit liegt auf der unglamourösen Hälfte der Softwareentwicklung: Systeme dazu bringen,</text><text x="44" y="133" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">zuverlässig Daten auszutauschen, obwohl sie nie füreinander gedacht waren. Lagerverwaltung, ERP-Integrationen,</text><text x="44" y="158" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Logistik-APIs. Die Sorte Code, bei der scheinbar nichts schiefgeht und eine Lieferung trotzdem still nicht ankommt.</text><text x="44" y="215" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">Die Repos hier sind die andere Hälfte. Dieselben Probleme, von Grund auf entworfen, mit der Zeit, die Struktur richtig</text><text x="44" y="240" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#4B6274">hinzubekommen, bevor etwas darauf aufbaut.</text>
  </svg>
