<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488"
    role="img" aria-label="How I think about building">
    <title>How I think about building</title>
    
    <defs>
      <linearGradient id="ramp-s15" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-2724.625" x2="0" y2="1335">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s15" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s15"><rect width="1000" height="488"/></clipPath>
      <radialGradient id="sun-s15" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-2887.01" r="2232.7937500000003">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="488" fill="url(#ramp-s15)"/><rect width="1000" height="488" fill="url(#sun-s15)"/>
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft-s15)" clip-path="url(#clip-s15)"><ellipse cx="120" cy="85.85338750000028" rx="120" ry="20"/></g><text x="44" y="58" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5"
      font-weight="700" letter-spacing="2.4" fill="#FFFFFF">APPROACH</text><text x="44" y="104" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="34"
      font-weight="800" letter-spacing="-1" fill="#EAF1F7">How I think about building</text><text x="44" y="146" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Draw the boundaries first.</tspan> Where the layers divide is the one decision that gets expensive once code sits on top of</text><text x="44" y="171" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">it. Everything else can be rewritten in an afternoon. So this is the part that gets the time.</text><text x="44" y="228" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Keep the core free of the framework.</tspan> Business logic that imports nothing can be tested without a browser, a server or</text><text x="44" y="253" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">a database. Push the side effects out to the edges. What is left in the middle stays simple enough to reason about.</text><text x="44" y="310" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Secure before there is data.</tspan> Row-level security is switched on before the table has a single row, and every policy</text><text x="44" y="335" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">denies by default. A permission you never granted is not one that can leak.</text><text x="44" y="392" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Write it down.</tspan> Every project I own has its architecture and conventions written down. Somebody new, or a language</text><text x="44" y="417" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">model, can read it cold and do useful work inside an hour.</text>
  </svg>
