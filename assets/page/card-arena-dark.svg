        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="500" height="190" fill="url(#ramp-s36)"/><rect width="500" height="190" fill="url(#sun-s36)"/>
    
    
    <rect x="14" y="14" width="472" height="162" rx="12"
