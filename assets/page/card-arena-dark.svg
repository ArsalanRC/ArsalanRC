<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190"
    role="img" aria-label="Game Arena: 28 games, one codebase, one rule: game logic never touches React.">
    <title>Game Arena</title>
    
    <defs>
      <linearGradient id="ramp-s36" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-1974.625" x2="0" y2="1525">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s36" x="-40%" y="-200%" width="180%" height="500%">
