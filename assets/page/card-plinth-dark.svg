    <text x="36" y="52" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="22" font-weight="800"
          letter-spacing="-0.6" fill="#EAF1F7">plinth</text>
    <!-- The one thing the page never said out loud: a card is a link
         to source, and a try-it row is a link to something running. The row has
         carried a play triangle since it shipped; this is its opposite number. -->
    <text x="964" y="50" text-anchor="end" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5"
          font-weight="700" letter-spacing="1.4" fill="#FF6A3D"
          fill-opacity="0.9">[ code ]</text>
    <text x="36" y="74" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5" font-weight="700"
          letter-spacing="2" fill="#9FB6C6">SOLIDITY · POLYGON</text>
    <text x="36" y="108" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="14"
             fill="#9FB6C6">An NFT marketplace where the art is drawn on chain,</text><text x="36" y="129" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="14"
             fill="#9FB6C6">and the front end talks to it with no library at all.</text>
    <line x1="36" y1="152" x2="964" y2="152" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="36" y="171" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="10.5"
