        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="190" fill="url(#ramp-s29)"/><rect width="1000" height="190" fill="url(#sun-s29)"/>
    
    <defs><filter id="lift-l26" x="-25%" y="-25%" width="150%" height="170%">
