    <title>plinth</title>
    
    <defs>
      <linearGradient id="ramp-s29" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-1670.625" x2="0" y2="2285">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s29" x="-40%" y="-200%" width="180%" height="500%">
