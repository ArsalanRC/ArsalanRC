        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="84" fill="url(#ramp-s100)"/><rect width="1000" height="84" fill="url(#sun-s100)"/>
    <g fill="#FFFFFF" opacity="0.85" filter="url(#soft-s100)" clip-path="url(#clip-s100)"><ellipse cx="880" cy="161.63160000000016" rx="140" ry="18"/></g>
    
    <rect x="28" y="8" width="944" height="68" rx="12"
          fill="#FFFFFF" fill-opacity="0.68"
