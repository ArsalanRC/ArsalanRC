    role="img" aria-label="Measure your own writing: Nineteen features of a text, each against a human corpus. It will not say who wrote it, and it tells you why">
    <title>Measure your own writing</title>
    
    <defs>
      <linearGradient id="ramp-s100" gradientUnits="userSpaceOnUse"
