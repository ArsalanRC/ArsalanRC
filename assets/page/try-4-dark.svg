        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="84" fill="url(#ramp-s23)"/><rect width="1000" height="84" fill="url(#sun-s23)"/>
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft-s23)" clip-path="url(#clip-s23)"><ellipse cx="880" cy="156.49194999999986" rx="140" ry="18"/></g>
    
    <rect x="28" y="8" width="944" height="68" rx="12"
          fill="#FFFFFF" fill-opacity="0.055"
