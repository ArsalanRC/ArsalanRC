<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 311" width="1000" height="311"
    role="img" aria-label="">
    <title></title>
    
    <defs>
      <linearGradient id="ramp-s53" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-265.625" x2="0" y2="3044">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s53" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s53"><rect width="1000" height="311"/></clipPath>
      <radialGradient id="sun-s53" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-398.01" r="1820.29375">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="311" fill="url(#ramp-s53)"/><rect width="1000" height="311" fill="url(#sun-s53)"/>
    <g fill="#FFFFFF" opacity="0.12" filter="url(#soft-s53)" clip-path="url(#clip-s53)"><ellipse cx="140" cy="38.8605" rx="150" ry="26"/><ellipse cx="200" cy="33.89606249999997" rx="90" ry="21"/><ellipse cx="620" cy="197.72250000000003" rx="130" ry="22"/></g><text x="44" y="26" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5" fill="#9FB6C6">
          <tspan font-weight="700" fill="#EAF1F7">Softwarearchitekt und Full-Stack-Engineer.</tspan> Aktuell Software Development Manager, das heißt, mir gehören die Systeme</text><text x="44" y="51" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">und die Roadmap, dazu ein ordentlicher Teil der Commits.</text><text x="44" y="108" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">Der größte Teil meiner Arbeit liegt auf der unglamourösen Hälfte der Softwareentwicklung: Systeme dazu bringen,</text><text x="44" y="133" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">zuverlässig Daten auszutauschen, obwohl sie nie füreinander gedacht waren. Lagerverwaltung, ERP-Integrationen,</text><text x="44" y="158" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">Logistik-APIs. Die Sorte Code, bei der scheinbar nichts schiefgeht und eine Lieferung trotzdem still nicht ankommt.</text><text x="44" y="215" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">Die Repos hier sind die andere Hälfte. Dieselben Probleme, von Grund auf entworfen, mit der Zeit, die Struktur richtig</text><text x="44" y="240" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="15.5"
          fill="#9FB6C6">hinzubekommen, bevor etwas darauf aufbaut.</text>
  </svg>
