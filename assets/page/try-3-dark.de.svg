<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84"
    role="img" aria-label="Einen Prozess mitten in der Transaktion abschießen: Drei Wege, ein Event zu veröffentlichen, und die zwei, nach denen Datenbank und Broker sich widersprechen">
    <title>Einen Prozess mitten in der Transaktion abschießen</title>
    
    <defs>
      <linearGradient id="ramp-s90" gradientUnits="userSpaceOnUse"
                      x1="0" y1="-1158" x2="0" y2="2176">
        <stop offset="0" stop-color="#070E17"/><stop offset="0.42" stop-color="#0B1622"/>
        <stop offset="0.78" stop-color="#12212F"/><stop offset="1" stop-color="#1A2E3F"/>
      </linearGradient>
      <filter id="soft-s90" x="-40%" y="-200%" width="180%" height="500%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <clipPath id="clip-s90"><rect width="1000" height="84"/></clipPath>
      <radialGradient id="sun-s90" gradientUnits="userSpaceOnUse"
                      cx="820" cy="-1291.3600000000001" r="1833.7">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1000" height="84" fill="url(#ramp-s90)"/><rect width="1000" height="84" fill="url(#sun-s90)"/>
    <g fill="#FFFFFF" opacity="undefined" filter="url(#soft-s90)" clip-path="url(#clip-s90)"><ellipse cx="880" cy="158.93000000000006" rx="140" ry="22"/></g>
    
    <rect x="28" y="8" width="944" height="68" rx="12"
          fill="#FFFFFF" fill-opacity="0.055"
          stroke="#FFFFFF" stroke-opacity="0.13"/>
    <path d="M40 8.75 H960" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1.5"/>
    <text x="44" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#FF6A3D">&#9654;</text>
    <text x="66" y="40" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="16" font-weight="700"
          fill="#EAF1F7">Einen Prozess mitten in der Transaktion abschießen</text>
    <text x="66" y="61" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif' font-size="13"
          fill="#6C879A">Drei Wege, ein Event zu veröffentlichen, und die zwei, nach denen Datenbank und Broker sich widersprechen</text>
  </svg>
